<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光影集 — 摄影作品集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c8a97e' stroke-width='1.5'><rect x='3' y='7' width='18' height='13' rx='2'/><circle cx='12' cy='13.5' r='4'/><path d='M8 7l1.5-3h5L16 7'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root {
  --bg: #0c0c0c;
  --bg-soft: #141414;
  --text: #e8e2d9;
  --text-dim: #8a8580;
  --accent: #c8a97e;
  --line: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  line-height: 1.7;
  overflow-x: hidden;
}
::selection { background: var(--accent); color: var(--bg); }

/* ===== HERO ===== */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  z-index: 0;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(12,12,12,0.1) 0%, rgba(12,12,12,0.3) 50%, var(--bg) 100%);
  z-index: 1;
}
.hero-content {
  position: relative;
  z-index: 2;
  padding: 0 8vw 12vh;
  max-width: 900px;
}
.hero-label {
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.5rem;
  font-weight: 400;
}
.hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 300;
  font-size: clamp(2.5rem, 6vw, 5rem);
  line-height: 1.2;
  letter-spacing: 0.02em;
  margin-bottom: 1.5rem;
}
.hero h1 em {
  font-style: normal;
  color: var(--accent);
}
.hero p {
  font-size: 1rem;
  color: var(--text-dim);
  max-width: 480px;
  line-height: 1.8;
}
.scroll-hint {
  position: absolute;
  bottom: 3rem;
  right: 8vw;
  z-index: 2;
  color: var(--text-dim);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  writing-mode: vertical-rl;
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.scroll-hint::after {
  content: '';
  display: block;
  width: 1px;
  height: 40px;
  background: var(--line);
}

/* ===== INTRO ===== */
.intro {
  padding: 14vh 8vw;
  max-width: 800px;
}
.intro p {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  line-height: 2;
  color: var(--text);
  font-weight: 300;
}
.intro p span {
  color: var(--accent);
}

/* ===== SECTION HEADER ===== */
.section {
  padding: 8vh 8vw;
}
.section-head {
  display: flex;
  align-items: baseline;
  gap: 2rem;
  margin-bottom: 5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
}
.section-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 0.85rem;
  color: var(--accent);
  letter-spacing: 0.1em;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  letter-spacing: 0.05em;
}
.section-sub {
  margin-left: auto;
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

/* ===== GALLERY GRID ===== */
.gallery {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 1.2rem;
}
.g-item {
  position: relative;
  overflow: hidden;
  cursor: zoom-in;
  background: var(--bg-soft);
  min-height: 320px;
}
.g-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.g-item:hover img {
  transform: scale(1.04);
}
.g-item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(12,12,12,0);
  transition: background 0.4s;
  pointer-events: none;
}
.g-item:hover::after {
  background: rgba(12,12,12,0.15);
}
/* grid spans */
.g-tall { grid-row: span 2; }
.g-3 { grid-column: span 3; }
.g-4 { grid-column: span 4; }
.g-5 { grid-column: span 5; }
.g-6 { grid-column: span 6; }
.g-7 { grid-column: span 7; }
.g-8 { grid-column: span 8; }
.g-12 { grid-column: span 12; }

/* ===== FOOTER ===== */
footer {
  padding: 10vh 8vw 5vh;
  border-top: 1px solid var(--line);
  margin-top: 10vh;
}
.footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 2rem;
}
.footer-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.1rem;
  color: var(--text-dim);
  font-style: italic;
}
.footer-meta {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-align: right;
  line-height: 2;
}

/* ===== LIGHTBOX ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 4vw;
}
.lightbox.active {
  display: flex;
}
.lightbox img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}
.lightbox-close {
  position: absolute;
  top: 2rem;
  right: 2rem;
  color: var(--text);
  background: none;
  border: none;
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;
  padding: 0.5rem;
  font-family: 'Noto Sans SC', sans-serif;
}
.lightbox-close:hover { color: var(--accent); }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .g-3, .g-4, .g-5 { grid-column: span 6; }
  .g-7, .g-8 { grid-column: span 12; }
  .g-tall { grid-row: span 1; }
  .scroll-hint { display: none; }
  .section-sub { display: none; }
}
@media (max-width: 600px) {
  .g-3, .g-4, .g-5, .g-6 { grid-column: span 12; }
  .hero-content { padding-bottom: 8vh; }
}
</style>
</head>
<body>

<!-- ===== HERO ===== -->
<section class="hero">
  <img src="assets/photo-07.jpg" alt="人像">
  <div class="hero-content">
    <div class="hero-label">Photography Portfolio</div>
    <h1>在光影里，<br>收集<em>人间烟火</em>。</h1>
    <p>镜头不是为了复刻世界，而是为了记住那些转瞬即逝的瞬间——一张脸、一片海、一个下午的光。</p>
  </div>
  <div class="scroll-hint">Scroll</div>
</section>

<!-- ===== INTRO ===== -->
<section class="intro">
  <p>这是一份关于<span>人、远方与日常</span>的视觉记录。从江南的柳树到三亚的海浪，从汉服少女的低头到水下鱼群的环绕——每一张照片都是一个时间切片，一个被光线选中的瞬间。</p>
</section>

<!-- ===== 第一章：人像 ===== -->
<section class="section">
  <div class="section-head">
    <span class="section-num">01</span>
    <h2 class="section-title">人像</h2>
    <span class="section-sub">Portraits</span>
  </div>
  <div class="gallery">
    <div class="g-item g-4"><img src="assets/photo-07.jpg" alt="旗袍女子"></div>
    <div class="g-item g-8"><img src="assets/photo-09.jpg" alt="林间少女"></div>
    <div class="g-item g-4"><img src="assets/photo-08.jpg" alt="水手服"></div>
    <div class="g-item g-4"><img src="assets/photo-10.jpg" alt="樱花树下"></div>
    <div class="g-item g-4"><img src="assets/photo-12.jpg" alt="汉服读书"></div>
    <div class="g-item g-4"><img src="assets/photo-22.jpg" alt="黑猫与少女"></div>
    <div class="g-item g-4"><img src="assets/photo-05.jpg" alt="海滩草帽"></div>
    <div class="g-item g-4"><img src="assets/photo-16.jpg" alt="沙滩情侣"></div>
    <div class="g-item g-12"><img src="assets/photo-20.jpg" alt="狮子与少年"></div>
  </div>
</section>

<!-- ===== 第二章：远方 ===== -->
<section class="section">
  <div class="section-head">
    <span class="section-num">02</span>
    <h2 class="section-title">远方</h2>
    <span class="section-sub">Elsewhere</span>
  </div>
  <div class="gallery">
    <div class="g-item g-12"><img src="assets/photo-18.jpg" alt="海上日落"></div>
    <div class="g-item g-5"><img src="assets/photo-11.jpg" alt="篁岭火烧云"></div>
    <div class="g-item g-7"><img src="assets/photo-13.jpg" alt="浮潜鱼群"></div>
    <div class="g-item g-4"><img src="assets/photo-02.jpg" alt="度假酒店泳池"></div>
    <div class="g-item g-4"><img src="assets/photo-15.jpg" alt="航拍桨板"></div>
    <div class="g-item g-4"><img src="assets/photo-04.jpg" alt="海滩秋千"></div>
    <div class="g-item g-6"><img src="assets/photo-01.jpg" alt="棕榈路牌"></div>

<!-- ===== 第三章：日常 ===== -->
<section class="section">
  <div class="section-head">
    <span class="section-num">03</span>
    <h2 class="section-title">日常</h2>
    <span class="section-sub">Everyday</span>
  </div>
  <div class="gallery">
    <div class="g-item g-7"><img src="assets/photo-19.jpg" alt="儿童展"></div>
    <div class="g-item g-5"><img src="assets/photo-21.jpg" alt="甜品刨冰"></div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="footer-inner">
    <div class="footer-quote">"摄影是留住时间的一种方式。"</div>
    <div class="footer-meta">
      光影集 · Photography Portfolio<br>
      &copy; 2024–2026 All Rights Reserved
    </div>
  </div>
</footer>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// Lightbox
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
// Bind clicks to all gallery images
document.querySelectorAll('.g-item img').forEach(function(img) {
  img.addEventListener('click', function() {
    openLightbox(this.src);
  });
});
</script>

</body>
</html>
